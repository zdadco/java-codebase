spring:
  datasource:
    url: jdbc:h2:mem:java_kb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  ai:
    openai:
      api-key: test
    vectorstore:
      qdrant:
        initialize-schema: false
    mcp:
      server:
        enabled: false

indexer:
  api-token: test-token
