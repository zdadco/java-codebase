services:
  postgres:
    image: postgres:16
    container_name: java-kb-postgres
    environment:
      POSTGRES_DB: java_kb
      POSTGRES_USER: java_kb
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-java_kb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U java_kb -d java_kb"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: java-kb-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  java-kb-indexer:
    build: .
    container_name: java-kb-indexer
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/java_kb
      DATABASE_USER: java_kb
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-java_kb}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-50}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      INDEXER_TOKEN: ${INDEXER_TOKEN:-changeme}

volumes:
  pgdata:
  qdrant_data:
